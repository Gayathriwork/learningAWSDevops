name: CI pipeline

on:
  workflow_dispatch: 

jobs:
  sonarqube:
    runs-on: mac

    steps:
      - name: code clone
        uses: actions/checkout@v7
        
      - name: Sonarqube Analysis
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.projectKey=NodeAPP
            -Dsonar.sources=.
            -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
            -Dsonar.qualitygate.wait=true
            
  Dockerimagebuild:
    runs-on: mac
    needs: sonarqube

    steps:
      - name: clone a code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker image build
        run: docker build -f Dockerfile.distroless -t distrolessnodeapp .

      - name: Tag and push a Docker image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker tag distrolessnodeapp ${{ vars.DOCKERHUB_USERNAME }}/nodeapp:$SHORT_SHA
          docker push ${{ vars.DOCKERHUB_USERNAME }}/nodeapp:$SHORT_SHA
      
