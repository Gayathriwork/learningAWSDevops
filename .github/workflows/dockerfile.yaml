run-name: Docker CI Pipeline

on:
  push: 
    branches: ["main"]
  workflow_dispatch: 

jobs:
  Dockerimagebuild:
    runs-on: mac

    steps:
      - name: clone a code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker image build
        run: docker run -f Dockerfile.Distroless -t distrolessNodeApp .

      - name: Tag and push a Docker image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker tag distrolessNodeApp ${{ vars.DOCKERHUB_USERNAME }}/nodeapp:$SHORT_SHA
          docker push ${{ vars.DOCKERHUB_USERNAME }}/nodeapp:$SHORT_SHA
      

       
