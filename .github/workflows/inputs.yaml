name: Node Input Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch: 
    inputs:
        environment:
          description: "select the environment to run"
          required: true
          default: "development"
          type: choice
          options:
            - development
            - production
        port:
         description: "select the port to run"
         required: true
         default: "8080"
         type: choice
         options:
           - 8080
           - 5001
jobs:
  inputjob:
    runs-on: mac
    environment: ${{  github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Code Clone
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          
      - name: Install dependencies
        run: npm install
        
      - name: create .env files
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "development ]]; then
            echo "PORT=8080" >> .env.development
            echo "APP=GHA_DEVELOPMENT_NODE_APP" >> .env.development
          else 
            echo "PORT=5001" >> .env.production
            echo "APP=GHA_PRODUCTION_NODE_APP" >> .env.production
          fi
          
      - name: run the application
        run: |
         node app.js ${{ github.event.inputs.environment }} &
         sleep 5
         curl http://localhost:${{ github.event.inputs.port }}
         curl http://localhost:${{ github.event.inputs.port }}/health
         pkill -f "node app.js"

  
